<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Presensi Kelas - QR Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --lime: #d4ff3a;
            --lime-dark: #a8cc1f;
            --pink: #ff5c8a;
            --pink-dark: #e63973;
            --blue: #4d7cff;
            --blue-dark: #2d5ce6;
            --orange: #ff8c42;
            --purple: #9b5de5;
            --cyan: #00d9c0;
            --yellow: #ffd60a;
            --red: #ff4757;
            --black: #0a0a0a;
            --white: #ffffff;
            --cream: #faf7f0;
            --gray: #e8e4dc;
            --border: 3px solid #0a0a0a;
            --shadow: 6px 6px 0 #0a0a0a;
            --shadow-sm: 4px 4px 0 #0a0a0a;
            --shadow-lg: 8px 8px 0 #0a0a0a;
            --radius: 16px;
            --radius-sm: 12px;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--cream);
            background-image:
                radial-gradient(circle at 20% 30%, rgba(212, 255, 58, 0.35) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 92, 138, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(77, 124, 255, 0.15) 0%, transparent 60%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 14px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: var(--white);
            border: var(--border);
            border-radius: 24px;
            padding: 24px 20px 20px;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        /* Decorative dots */
        .container::before {
            content: '';
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: var(--pink);
            border: var(--border);
            border-radius: 50%;
            z-index: 1;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: -8px;
            width: 24px;
            height: 24px;
            background: var(--lime);
            border: var(--border);
            border-radius: 50%;
            z-index: 1;
        }

        /* ---- Header ---- */
        .header {
            text-align: center;
            margin-bottom: 22px;
            position: relative;
        }

        .icon-circle {
            width: 74px;
            height: 74px;
            background: var(--lime);
            border: var(--border);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 30px;
            color: var(--black);
            box-shadow: var(--shadow);
            transform: rotate(-4deg);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .icon-circle:hover {
            transform: rotate(4deg) scale(1.05);
        }

        h1 {
            color: var(--black);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 6px;
            line-height: 1;
        }

        h1 span {
            background: var(--yellow);
            padding: 2px 8px;
            border: var(--border);
            border-radius: 8px;
            display: inline-block;
            transform: rotate(-2deg);
            box-shadow: 3px 3px 0 var(--black);
        }

        .subtitle {
            color: var(--black);
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--cyan);
            padding: 6px 14px;
            border: var(--border);
            border-radius: 999px;
            box-shadow: 3px 3px 0 var(--black);
            margin-top: 4px;
            font-family: 'Space Mono', monospace;
            letter-spacing: -0.3px;
        }

        .subtitle i {
            font-size: 10px;
        }

        /* ---- QR Display ---- */
        .qr-wrapper {
            background: var(--white);
            border: var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            text-align: center;
            position: relative;
        }

        .qr-wrapper::before {
            content: 'SCAN ME';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(-3deg);
            background: var(--pink);
            color: var(--white);
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 14px;
            border: var(--border);
            border-radius: 999px;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 var(--black);
        }

        #qrImage {
            width: 200px;
            height: 200px;
            display: block;
            border-radius: 10px;
            margin: 6px auto 0;
            border: 2px dashed var(--gray);
            padding: 6px;
            background: var(--white);
        }

        .qr-wrapper .qr-label {
            color: var(--black);
            font-size: 12px;
            font-weight: 700;
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--lime);
            padding: 6px 14px;
            border: 2px solid var(--black);
            border-radius: 999px;
            box-shadow: 2px 2px 0 var(--black);
            font-family: 'Space Mono', monospace;
        }

        /* ---- Buttons ---- */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 18px;
            border: var(--border);
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 12px;
            font-family: 'Space Grotesk', inherit;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            flex: 1;
            justify-content: center;
            min-width: 0;
            color: var(--black);
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--black);
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0 var(--black);
        }

        .btn-primary { background: var(--lime); }
        .btn-secondary { background: var(--blue); color: var(--white); }
        .btn-outline { background: var(--white); }
        .btn-success { background: var(--cyan); }
        .btn-pink { background: var(--pink); color: var(--white); }

        /* ---- Divider ---- */
        .divider {
            display: flex;
            align-items: center;
            margin: 22px 0 14px;
            gap: 12px;
            color: var(--black);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Space Mono', monospace;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 3px;
            background: var(--black);
            border-radius: 3px;
        }

        .divider span {
            background: var(--yellow);
            padding: 4px 12px;
            border: 2px solid var(--black);
            border-radius: 999px;
            box-shadow: 2px 2px 0 var(--black);
        }

        /* ---- Generate QR ---- */
        .qr-generate-section {
            padding: 4px 0 8px 0;
        }

        .qr-generate-section .qr-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--black);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .qr-generate-section .qr-label i {
            background: var(--purple);
            color: var(--white);
            width: 26px;
            height: 26px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 2px solid var(--black);
        }

        .qr-generate-section .qr-input-group {
            display: flex;
            gap: 10px;
        }

        .qr-generate-section .qr-input-group input {
            flex: 1;
            padding: 12px 16px;
            border: var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            background: var(--white);
            color: var(--black);
            transition: all 0.2s;
            box-shadow: inset 3px 3px 0 rgba(0,0,0,0.06);
        }

        .qr-generate-section .qr-input-group input:focus {
            outline: none;
            background: var(--yellow);
            box-shadow: var(--shadow-sm);
            transform: translate(-1px, -1px);
        }

        .qr-generate-section .qr-input-group input::placeholder {
            color: rgba(0,0,0,0.3);
            font-weight: 500;
        }

        .qr-generate-section .qr-input-group button {
            padding: 12px 20px;
            background: var(--orange);
            color: var(--black);
            border: var(--border);
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            font-family: 'Space Grotesk', inherit;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }

        .qr-generate-section .qr-input-group button:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--black);
        }

        /* ---- QR Preview ---- */
        .qr-preview {
            margin-top: 14px;
            padding: 18px;
            background: var(--cyan);
            border: var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            text-align: center;
            display: none;
        }

        .qr-preview.show {
            display: block !important;
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) rotate(-2deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .qr-preview img {
            max-width: 160px;
            height: auto;
            border-radius: 10px;
            background: white;
            padding: 8px;
            border: var(--border);
            box-shadow: var(--shadow-sm);
        }

        .qr-preview .qr-info {
            margin-top: 12px;
            font-size: 12px;
            color: var(--black);
            line-height: 1.7;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
        }

        .qr-preview .qr-info strong {
            color: var(--black);
            background: var(--yellow);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .qr-preview .qr-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .qr-preview .qr-actions button {
            padding: 8px 16px;
            border: var(--border);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Space Grotesk', inherit;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 3px 3px 0 var(--black);
            color: var(--black);
        }

        .qr-preview .qr-actions .btn-download {
            background: var(--lime);
        }

        .qr-preview .qr-actions .btn-close {
            background: var(--white);
        }

        .qr-preview .qr-actions button:hover {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--black);
        }

        /* ---- Scanner ---- */
        .scanner-area {
            position: relative;
            background: var(--black);
            border: var(--border);
            border-radius: var(--radius);
            margin-top: 14px;
            min-height: 300px;
            width: 100%;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        #qr-reader {
            width: 100% !important;
            min-height: 300px;
            background: #0a0a0a;
            position: relative;
        }

        #qr-reader video {
            width: 100% !important;
            height: auto !important;
            border-radius: 0 !important;
            display: block !important;
        }

        #qr-reader > div:not(:first-child) {
            display: none !important;
        }

        #qr-reader > div:first-child {
            width: 100% !important;
            height: auto !important;
        }

        #qr-reader > div:first-child > div:first-child {
            width: 100% !important;
            height: auto !important;
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .scanner-overlay .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 62%;
            height: 42%;
            border: 3px dashed var(--lime);
            border-radius: 16px;
            box-shadow: 0 0 0 4000px rgba(10, 10, 10, 0.6);
        }

        .scanner-overlay .scan-frame .corner {
            position: absolute;
            width: 26px;
            height: 26px;
            border-color: var(--lime);
            border-style: solid;
            border-width: 0;
        }

        .corner-tl { top: -3px; left: -3px; border-top-width: 5px; border-left-width: 5px; border-radius: 8px 0 0 0; }
        .corner-tr { top: -3px; right: -3px; border-top-width: 5px; border-right-width: 5px; border-radius: 0 8px 0 0; }
        .corner-bl { bottom: -3px; left: -3px; border-bottom-width: 5px; border-left-width: 5px; border-radius: 0 0 0 8px; }
        .corner-br { bottom: -3px; right: -3px; border-bottom-width: 5px; border-right-width: 5px; border-radius: 0 0 8px 0; }

        .scanner-overlay .scan-line {
            position: absolute;
            top: 30%;
            left: 18%;
            right: 18%;
            height: 4px;
            background: var(--lime);
            animation: scanMove 2.5s ease-in-out infinite;
            border-radius: 4px;
            box-shadow: 0 0 20px var(--lime), 0 0 40px var(--lime);
        }

        @keyframes scanMove {
            0% { top: 30%; opacity: 0.6; }
            50% { top: 70%; opacity: 1; }
            100% { top: 30%; opacity: 0.6; }
        }

        .scanner-overlay .scan-text {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--black);
            font-size: 11px;
            font-weight: 700;
            background: var(--lime);
            padding: 8px 16px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid var(--black);
            z-index: 15;
            white-space: nowrap;
            font-family: 'Space Mono', monospace;
            box-shadow: 3px 3px 0 var(--black);
        }

        .scanner-overlay .scan-text i {
            color: var(--black);
            font-size: 12px;
            animation: blinkIcon 1.2s ease-in-out infinite;
        }

        @keyframes blinkIcon {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ---- Scanner Controls ---- */
        .scanner-controls {
            display: flex;
            gap: 10px;
            padding: 14px 0 0;
        }

        .scanner-controls button {
            flex: 1;
            padding: 14px;
            border: var(--border);
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            font-family: 'Space Grotesk', inherit;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            color: var(--black);
        }

        .scanner-controls button:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--black);
        }

        .scanner-controls button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0 var(--black);
        }

        .btn-scan {
            background: var(--lime);
        }

        .btn-scan.stop {
            background: var(--red);
            color: var(--white);
        }

        .btn-flash {
            background: var(--white);
            flex: 0.4;
        }

        .btn-flash.active {
            background: var(--yellow);
        }

        /* ---- Status ---- */
        #status {
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
            line-height: 1.5;
            border: var(--border);
            box-shadow: var(--shadow-sm);
            color: var(--black);
            font-family: 'Space Mono', monospace;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #status i {
            font-size: 18px;
            flex-shrink: 0;
        }

        #status.success { display: flex; background: var(--lime); }
        #status.error { display: flex; background: var(--red); color: var(--white); }
        #status.info { display: flex; background: var(--cyan); }
        #status.warning { display: flex; background: var(--yellow); }

        /* ---- Data Section ---- */
        .data-section {
            margin-top: 18px;
            background: var(--white);
            border: var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .data-section .data-header {
            padding: 14px 16px;
            background: var(--purple);
            border-bottom: var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-section .data-header .title {
            color: var(--white);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-section .data-header .title i {
            color: var(--lime);
        }

        .data-section .data-header .count {
            color: var(--black);
            font-size: 11px;
            font-weight: 700;
            background: var(--lime);
            padding: 4px 12px;
            border-radius: 999px;
            border: 2px solid var(--black);
            font-family: 'Space Mono', monospace;
        }

        .data-section .table-wrapper {
            max-height: 220px;
            overflow-y: auto;
            background: var(--white);
        }

        .data-section .table-wrapper::-webkit-scrollbar {
            width: 8px;
        }

        .data-section .table-wrapper::-webkit-scrollbar-track {
            background: var(--gray);
        }

        .data-section .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--black);
            border-radius: 8px;
        }

        .data-section table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-section table th {
            padding: 10px 12px;
            text-align: left;
            color: var(--white);
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: var(--border);
            position: sticky;
            top: 0;
            background: var(--black);
            font-family: 'Space Mono', monospace;
        }

        .data-section table td {
            padding: 10px 12px;
            border-bottom: 2px solid var(--gray);
            color: var(--black);
            font-weight: 500;
        }

        .data-section table tr:nth-child(even) td {
            background: rgba(232, 228, 220, 0.4);
        }

        .data-section table tr:hover td {
            background: var(--yellow);
        }

        .data-section table .status-hadir {
            color: var(--black);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--lime);
            padding: 3px 10px;
            border: 2px solid var(--black);
            border-radius: 999px;
            font-size: 10px;
            font-family: 'Space Mono', monospace;
        }

        .data-section table .status-belum {
            color: var(--black);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--gray);
            padding: 3px 10px;
            border: 2px solid var(--black);
            border-radius: 999px;
            font-size: 10px;
            font-family: 'Space Mono', monospace;
        }

        /* ---- Connection Status ---- */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            background: var(--white);
            border: var(--border);
            margin-top: 12px;
            justify-content: center;
            color: var(--black);
            box-shadow: var(--shadow-sm);
            font-family: 'Space Mono', monospace;
        }

        .connection-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            border: 2px solid var(--black);
        }

        .connection-status .dot.online {
            background: var(--lime);
        }

        .connection-status .dot.offline {
            background: var(--red);
            animation: pulseDot 1s ease-in-out infinite;
        }

        .connection-status .dot.checking {
            background: var(--yellow);
            animation: pulseDot 0.8s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.7); }
        }

        /* ---- Footer ---- */
        .footer-note {
            margin-top: 18px;
            font-size: 11px;
            color: var(--black);
            text-align: center;
            line-height: 1.8;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
        }

        .footer-note i {
            color: var(--purple);
        }

        .footer-note a {
            color: var(--black);
            text-decoration: none;
            background: var(--lime);
            padding: 2px 8px;
            border: 2px solid var(--black);
            border-radius: 6px;
            box-shadow: 2px 2px 0 var(--black);
            display: inline-block;
            transition: all 0.15s;
        }

        .footer-note a:hover {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--black);
        }

        .footer-note .presensi-status-line {
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            background: var(--white);
            padding: 4px 12px;

</head>
<body>

    <div class="container">
        <div class="header">
            <div class="icon-circle">
                <i class="fas fa-qrcode"></i>
            </div>

        <div class="qr-wrapper">

        <div class="btn-group">

            <a id="sheetLink" href="#" target="_blank" class="btn btn-secondary">

            <div class="qr-preview" id="qrPreview">

                <div class="qr-info" id="qrInfo"></div>

        <div class="divider">
            <span>scan QR Code</span>

                <div class="scan-frame">

                    <div class="corner corner-tr"></div>
                    <div class="corner corner-bl"></div>

                    <div class="scan-line"></div>
                </div>

                    <i class="fas fa-qrcode"></i>

            </div>

                    <i class="fas fa-spinner fa-spin"></i> Memuat data...
                </div>
                <table id="dataTable" style="display:none;">
                    <thead>
                        <tr>
                            <th>NIM</th>
                            <th>Nama</th>

        <div class="footer-note">

            <a id="footerSheetLink" href="#" target="_blank">Google Sheets</a>
            <br>
            <span class="presensi-status-line">
                <i class="fas fa-check-circle" style="color:#9b5de5;"></i>
                Status: <span id="presensiStatus">Menunggu scan</span>
            </span>
        </div>
    </div>

<script>
/* ===================================================================
   FRONTEND — Presensi Kelas QR
   Data PERMANEN di Google Sheets (lihat file Code.gs terpisah).
   localStorage hanya sebagai CACHE offline.
   =================================================================== */

/* ---------------- KONFIGURASI ---------------- */
const CONFIG = {
  // ▼▼▼ GANTI dengan URL Web App Apps Script Anda ▼▼▼
  API_URL: 'https://script.google.com/macros/s/AKfycbwFaiXWeQmp9D1U6YKlNM2u28Dgp8mcnYmzWxoWXH_FS3Po3oWJt1-kknsCZ_yRDranPQ/exec',
  SHEET_URL: 'https://docs.google.com/spreadsheets/d/1PXOSZAXZNg7hvX-33DglZlM3saj4yclUhiYepiFNYhI/edit?gid=0#gid=0',
  SHEET_GID_MAHASISWA: '0',
  SHEET_GID_PRESENSI: '646034675',
  CACHE_KEY_MAHASISWA: 'presensi_mahasiswa_cache_v2',
  CACHE_KEY_PRESENSI: 'presensi_hari_ini_cache_v2',
  REFRESH_INTERVAL_MS: 30000,
  RESCAN_DELAY_MS: 2500
};
/* --------------------------------------------- */

/* ---------------- STATE ---------------- */
const State = {
  scanner: null,
  scanning: false,
  flashOn: false,
  processing: false,
  mahasiswa: [],
  presensiHariIni: {},
  isOnline: false,
  tanggalHariIni: ''
};

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const DOM = {
  status: $('status'),
  scanStatus: $('scanStatusText'),
  presensiStatus: $('presensiStatus'),
  btnStartScan: $('btnStartScan'),
  btnFlash: $('btnFlash'),
  qrImage: $('qrImage'),
  tableBody: $('tableBody'),
  dataTable: $('dataTable'),
  loadingData: $('loadingData'),
  totalMahasiswa: $('totalMahasiswa'),
  statusDot: $('statusDot'),
  statusLabel: $('statusLabel'),
  qrNimInput: $('qrNimInput'),
  qrResultImage: $('qrResultImage'),
  qrInfo: $('qrInfo'),
  qrPreview: $('qrPreview')
};

/* ================== UTIL ================== */
function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function setConnectionStatus(status, message) {
  if (!DOM.statusDot || !DOM.statusLabel) return;
  DOM.statusDot.className = 'dot ' + status;
  DOM.statusLabel.textContent = message;
  State.isOnline = (status === 'online');
}

let statusTimer;
function showStatus(message, type = 'info', duration = 4000) {
  if (!DOM.status) return;
  const iconMap = {
    success: 'fa-check-circle',
    error: 'fa-exclamation-circle',
    warning: 'fa-triangle-exclamation',
    info: 'fa-info-circle'
  };
  DOM.status.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
  DOM.status.className = type;
  DOM.status.style.display = 'flex';
  clearTimeout(statusTimer);
  if (duration > 0) {
    statusTimer = setTimeout(() => { DOM.status.style.display = 'none'; }, duration);
  }
}

/* ================== API HELPER ================== */
async function apiGet(action, params = {}) {
  const qs = new URLSearchParams({ action, t: Date.now(), ...params });
  const res = await fetch(CONFIG.API_URL + '?' + qs.toString(), {
    method: 'GET',
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function apiPost(action, payload = {}) {
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

/* ================== CACHE ================== */
function loadCacheMahasiswa() {
  try {
    const raw = localStorage.getItem(CONFIG.CACHE_KEY_MAHASISWA);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function saveCacheMahasiswa(data) {
  try { localStorage.setItem(CONFIG.CACHE_KEY_MAHASISWA, JSON.stringify(data)); } catch {}
}

function loadCachePresensi() {
  try {
    const raw = localStorage.getItem(CONFIG.CACHE_KEY_PRESENSI);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed.tanggal !== todayStr()) return null;
    return parsed.map || {};
  } catch { return null; }
}

function saveCachePresensi(map) {
  try {
    localStorage.setItem(CONFIG.CACHE_KEY_PRESENSI, JSON.stringify({
      tanggal: todayStr(),
      map
    }));
  } catch {}
}

/* ================== LOAD DATA ================== */
async function checkConnection() {
  setConnectionStatus('checking', 'Mengecek koneksi...');
  try {
    const json = await apiGet('ping');
    if (json.success) {
      setConnectionStatus('online', '✅ Terhubung ke server');
      return true;
    }
    throw new Error(json.error || 'Ping gagal');
  } catch (err) {
    setConnectionStatus('offline', '📴 Offline');
    return false;
  }
}

async function loadAllData() {
  State.tanggalHariIni = todayStr();

  const cachedMhs = loadCacheMahasiswa();
  if (cachedMhs.length) {
    State.mahasiswa = cachedMhs;
    State.presensiHariIni = loadCachePresensi() || {};
    renderDataTable();
  } else {
    if (DOM.loadingData) DOM.loadingData.style.display = 'block';
    if (DOM.dataTable) DOM.dataTable.style.display = 'none';
  }

  const online = await checkConnection();
  if (!online) {
    if (!cachedMhs.length) {
      showEmptyState('offline');
    } else {
      showStatus('📂 Mode offline — data dari cache', 'warning', 3000);
    }
    return;
  }

  try {
    const mhsRes = await apiGet('get_all');
    if (mhsRes.success && Array.isArray(mhsRes.data)) {
      State.mahasiswa = mhsRes.data;
      saveCacheMahasiswa(mhsRes.data);
    } else {
      showStatus('⚠️ ' + (mhsRes.error || 'Gagal memuat mahasiswa'), 'warning', 3500);
    }

    const presRes = await apiGet('get_presensi', { tanggal: todayStr() });
    if (presRes.success && Array.isArray(presRes.data)) {
      const map = {};
      presRes.data.forEach(p => { if (p.nim) map[String(p.nim).trim()] = p; });
      State.presensiHariIni = map;
      saveCachePresensi(map);
    }

    renderDataTable();
    showStatus(`✅ ${State.mahasiswa.length} mahasiswa · ${Object.keys(State.presensiHariIni).length} hadir hari ini`, 'success', 2500);
  } catch (err) {
    console.error(err);
    if (State.mahasiswa.length) {
      showStatus('⚠️ Gagal sinkron server — pakai cache', 'warning', 3500);
      renderDataTable();
    } else {
      showEmptyState('error', err.message);
    }
  }
}

/* ================== RENDER ================== */
function renderDataTable() {
  if (!DOM.tableBody || !DOM.dataTable || !DOM.loadingData) return;
  DOM.tableBody.innerHTML = '';

  if (!State.mahasiswa.length) {
    showEmptyState('empty');
    return;
  }

  State.mahasiswa.forEach(mhs => {
    const nim = String(mhs.nim || '').trim();
    const hadir = !!State.presensiHariIni[nim];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${escapeHtml(nim || '-')}</strong></td>
      <td>${escapeHtml(mhs.nama || '-')}</td>
      <td>${escapeHtml(mhs.kelas || '-')}</td>
      <td>${escapeHtml(mhs.jurusan || '-')}</td>
      <td>
        <span class="${hadir ? 'status-hadir' : 'status-belum'}">
          <i class="fas ${hadir ? 'fa-check' : 'fa-clock'}"></i>
          ${hadir ? 'Hadir' : 'Belum'}
        </span>
      </td>`;
    DOM.tableBody.appendChild(tr);
  });

  DOM.loadingData.style.display = 'none';
  DOM.dataTable.style.display = 'table';
  const totalHadir = Object.keys(State.presensiHariIni).length;
  DOM.totalMahasiswa.textContent = `${totalHadir} / ${State.mahasiswa.length} mahasiswa`;
}

function showEmptyState(kind, detail = '') {
  if (!DOM.loadingData) return;
  DOM.dataTable.style.display = 'none';
  DOM.loadingData.style.display = 'block';
  DOM.totalMahasiswa.textContent = '0 mahasiswa';

  const btnStyle = 'padding:10px 20px;background:#d4ff3a;color:#0a0a0a;border:3px solid #0a0a0a;border-radius:12px;cursor:pointer;font-weight:700;font-family:inherit;font-size:12px;box-shadow:3px 3px 0 #0a0a0a;';

  if (kind === 'offline') {
    DOM.loadingData.innerHTML = `
      <i class="fas fa-wifi" style="color:#ff4757;font-size:28px;display:block;margin-bottom:14px;"></i>
      <strong style="color:#ff4757;font-size:14px;">Tidak Ada Koneksi</strong><br><br>
      <span style="color:rgba(0,0,0,0.5);font-size:12px;">Tidak ada internet & tidak ada cache.</span><br><br>
      <button onclick="loadAllData()" style="${btnStyle}">
        <i class="fas fa-sync-alt"></i> Coba Lagi
      </button>`;
  } else if (kind === 'empty') {
    DOM.loadingData.innerHTML = `
      <i class="fas fa-info-circle" style="color:#ff8c42;font-size:24px;display:block;margin-bottom:14px;"></i>
      <strong style="color:#ff8c42;font-size:14px;">Belum ada data mahasiswa</strong><br><br>
      <span style="color:rgba(0,0,0,0.5);font-size:12px;">Tambahkan data di sheet "Mahasiswa".</span><br><br>
      <a href="${CONFIG.SHEET_URL}" target="_blank" style="${btnStyle}text-decoration:none;display:inline-block;">
        <i class="fas fa-external-link-alt"></i> Buka Google Sheets
      </a>`;
  } else {
    DOM.loadingData.innerHTML = `
      <i class="fas fa-exclamation-circle" style="color:#ff4757;font-size:28px;display:block;margin-bottom:14px;"></i>
      <strong style="color:#ff4757;font-size:14px;">Gagal Memuat Data</strong><br><br>
      <span style="color:rgba(0,0,0,0.5);font-size:12px;">${escapeHtml(detail)}</span><br><br>
      <button onclick="loadAllData()" style="${btnStyle}">
        <i class="fas fa-sync-alt"></i> Coba Lagi
      </button>`;
  }
}

/* ================== QR UMUM ================== */
function generateQR() {
  if (!DOM.qrImage) return;
  const qrData = {
    nim: 'ABSENSI-KELAS',
    nama: 'Presensi Kelas',
    kelas: 'Semua',
    jurusan: 'Semua',
    link_sheet: CONFIG.SHEET_URL,
    timestamp: new Date().toISOString()
  };
  DOM.qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(JSON.stringify(qrData))}`;
}

function downloadQR() {
  if (!DOM.qrImage.src) { alert('QR Code belum siap.'); return; }
  const a = document.createElement('a');
  a.download = 'qr-presensi-kelas.png';
  a.href = DOM.qrImage.src;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ================== QR PER MAHASISWA ================== */
function generateQRCode() {
  const nim = DOM.qrNimInput.value.trim();
  if (!nim) { showStatus('❌ Masukkan NIM terlebih dahulu', 'error'); DOM.qrNimInput.focus(); return; }
  if (nim.length < 3) { showStatus('❌ NIM minimal 3 karakter', 'error'); return; }

  const mhs = State.mahasiswa.find(m => String(m.nim).trim() === nim);
  if (!mhs) { showStatus(`❌ NIM ${escapeHtml(nim)} tidak terdaftar!`, 'error'); return; }

  const qrData = {
    nim: mhs.nim,
    nama: mhs.nama,
    kelas: mhs.kelas,
    jurusan: mhs.jurusan,
    link_sheet: CONFIG.SHEET_URL,
    timestamp: new Date().toISOString()
  };
  DOM.qrResultImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(JSON.stringify(qrData))}`;
  DOM.qrInfo.innerHTML = `
    <strong>NIM:</strong> ${escapeHtml(mhs.nim)}<br>
    <strong>Nama:</strong> ${escapeHtml(mhs.nama)}<br>
    <strong>Kelas:</strong> ${escapeHtml(mhs.kelas)}<br>
    <strong>Jurusan:</strong> ${escapeHtml(mhs.jurusan)}
    <div style="margin-top:8px;font-size:12px;">
      ✅ Scan QR untuk presensi
    </div>`;
  DOM.qrPreview.classList.add('show');
  showStatus(`✅ QR Code dibuat untuk ${escapeHtml(mhs.nama)}`, 'success');
}

function downloadQRCode() {
  if (!DOM.qrResultImage.src) { showStatus('❌ Tidak ada QR Code', 'error'); return; }
  const a = document.createElement('a');
  const nim = DOM.qrNimInput.value.trim() || 'mahasiswa';
  a.download = `qr-code-${nim}.png`;
  a.href = DOM.qrResultImage.src;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showStatus('✅ QR Code berhasil didownload!', 'success');
}

function closeQRPreview() {
  DOM.qrPreview.classList.remove('show');
  DOM.qrNimInput.value = '';
}

/* ================== SCANNER ================== */
function toggleScanner() {
  if (State.scanning) stopScanner();
  else startScanner();
}

function startScanner() {
  if (State.scanning) return;

  if (State.scanner) {
    try { State.scanner.clear(); } catch {}
    State.scanner = null;
  }

  const readerEl = $('qr-reader');
  if (readerEl) readerEl.innerHTML = '';

  if (DOM.btnStartScan) {
    DOM.btnStartScan.classList.add('stop');
    DOM.btnStartScan.innerHTML = '<i class="fas fa-stop"></i> Stop Scan';
  }

  try {
    State.scanner = new Html5Qrcode("qr-reader", {
      verbose: false,
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
    });

    const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
    const onSuccess = (text) => onScanSuccess(text);
    const onError = () => {};

    State.scanner.start({ facingMode: "environment" }, config, onSuccess, onError)
      .then(() => onScannerStarted('📷 Kamera belakang aktif'))
      .catch(() => {
        State.scanner.start({ facingMode: "user" }, config, onSuccess, onError)
          .then(() => onScannerStarted('📷 Kamera depan aktif'))
          .catch(err2 => {
            showStatus('❌ Gagal akses kamera: ' + err2.message, 'error', 0);
            resetScannerButton();
          });
      });
  } catch (err) {
    showStatus('❌ Gagal inisialisasi scanner', 'error', 0);
    resetScannerButton();
  }
}

function onScannerStarted(msg) {
  State.scanning = true;
  if (DOM.scanStatus) DOM.scanStatus.textContent = '🔍 Mendeteksi QR Code...';
  if (DOM.presensiStatus) DOM.presensiStatus.textContent = 'Mendeteksi...';
  showStatus(msg, 'info', 3000);
}

function stopScanner() {
  if (State.scanner && State.scanning) {
    State.scanner.stop()
      .then(() => {
        try { State.scanner.clear(); } catch {}
        State.scanner = null;
        State.scanning = false;
        resetScannerButton();
        if (DOM.scanStatus) DOM.scanStatus.textContent = '⏸ Scanner berhenti';
      })
      .catch(() => {});
  } else {
    State.scanning = false;
    resetScannerButton();
  }
}

function resetScannerButton() {
  if (!DOM.btnStartScan) return;
  DOM.btnStartScan.classList.remove('stop');
  DOM.btnStartScan.innerHTML = '<i class="fas fa-play"></i> <span id="btnScanLabel">Mulai Scan</span>';
}

/* ================== SCAN SUCCESS ================== */
function onScanSuccess(decodedText) {
  if (State.processing) return;
  State.processing = true;

  if (State.scanner && State.scanning) {
    State.scanner.stop()
      .then(() => { try { State.scanner.clear(); } catch {} State.scanner = null; State.scanning = false; resetScannerButton(); })
      .catch(() => {});
  }

  processPresensi(decodedText);
}

/* ================== PROSES PRESENSI ================== */
async function processPresensi(qrData) {
  const tanggal = todayStr();
  try {
    showStatus('⏳ Memproses presensi...', 'info', 0);

    let nim = '';
    try {
      const parsed = JSON.parse(qrData);
      nim = String(parsed.nim || '').trim();
    } catch {
      nim = String(qrData || '').trim();
    }

    if (!nim || nim.length < 3) {
      showStatus('❌ NIM tidak valid (minimal 3 karakter)', 'error');
      return;
    }

    const mhs = State.mahasiswa.find(m => String(m.nim).trim() === nim);
    if (!mhs) {
      showStatus(`❌ NIM ${escapeHtml(nim)} tidak terdaftar!`, 'error');
      return;
    }

    if (State.presensiHariIni[nim]) {
      showStatus(`⚠️ ${escapeHtml(mhs.nama)} sudah presensi hari ini!`, 'warning');
      if (DOM.scanStatus) DOM.scanStatus.textContent = '⚠️ Sudah presensi';
      if (DOM.presensiStatus) DOM.presensiStatus.textContent = '⚠️ Sudah hadir';
      return;
    }

    const payload = {
      nim,
      nama: mhs.nama || '',
      kelas: mhs.kelas || '',
      jurusan: mhs.jurusan || '',
      mataKuliah: 'Presensi Kelas',
      status: 'Hadir'
    };

    let result;
    try {
      result = await apiPost('presensi', payload);
    } catch (netErr) {
      State.presensiHariIni[nim] = { nim, tanggal, offline: true, waktu: new Date().toLocaleString('id-ID') };
      saveCachePresensi(State.presensiHariIni);
      renderDataTable();
      showStatus(`📴 Offline — ${escapeHtml(mhs.nama)} dicatat lokal.`, 'warning', 5000);
      if (DOM.scanStatus) DOM.scanStatus.textContent = '📴 Tersimpan lokal';
      return;
    }

    if (result.success) {
      State.presensiHariIni[nim] = { nim, tanggal, waktu: result.waktu || '', nama: mhs.nama };
      saveCachePresensi(State.presensiHariIni);
      renderDataTable();
      showStatus(`✅ ${escapeHtml(mhs.nama)} HADIR!`, 'success', 3500);
      if (DOM.scanStatus) DOM.scanStatus.textContent = '✅ Hadir!';
      if (DOM.presensiStatus) DOM.presensiStatus.textContent = '✅ Hadir';
    } else if (result.already) {
      State.presensiHariIni[nim] = { nim, tanggal, waktu: result.data?.waktu || '' };
      saveCachePresensi(State.presensiHariIni);
      renderDataTable();
      showStatus(`⚠️ ${escapeHtml(mhs.nama)} sudah presensi (server)`, 'warning', 3500);
      if (DOM.scanStatus) DOM.scanStatus.textContent = '⚠️ Sudah presensi';
    } else {
      showStatus('❌ ' + (result.error || 'Gagal menyimpan presensi'), 'error', 4000);
    }
  } catch (err) {
    console.error(err);
    showStatus('❌ Error: ' + err.message, 'error', 4000);
  } finally {
    setTimeout(() => {
      State.processing = false;
      if (DOM.scanStatus) DOM.scanStatus.textContent = 'Arahkan ke QR Code';
      if (!State.scanning) startScanner();
    }, CONFIG.RESCAN_DELAY_MS);
  }
}

/* ================== FLASH ================== */
async function toggleFlash() {
  State.flashOn = !State.flashOn;
  if (!DOM.btnFlash) return;

  if (State.flashOn) {
    DOM.btnFlash.classList.add('active');
    DOM.btnFlash.innerHTML = '<i class="fas fa-bolt"></i>';
  } else {
    DOM.btnFlash.classList.remove('active');
    DOM.btnFlash.innerHTML = '<i class="fas fa-bolt"></i>';
  }

  try {
    const video = document.querySelector('#qr-reader video');
    if (!video || !video.srcObject) return;
    const track = video.srcObject.getVideoTracks()[0];
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) {
      await track.applyConstraints({ advanced: [{ torch: State.flashOn }] });
    }
  } catch (e) { /* torch tidak didukung */ }
}

/* ================== IZIN KAMERA ================== */
async function checkCameraPermission() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus('❌ Browser tidak mendukung kamera', 'error', 0);
      return false;
    }
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    stream.getTracks().forEach(t => t.stop());
    return true;
  } catch {
    showStatus('❌ Izin kamera diperlukan untuk scan QR Code', 'error', 0);
    return false;
  }
}

/* ================== INIT ================== */
async function init() {
  State.tanggalHariIni = todayStr();

  const sheetLinkPres = CONFIG.SHEET_URL + '#gid=' + CONFIG.SHEET_GID_PRESENSI;
  if ($('sheetLink')) $('sheetLink').href = sheetLinkPres;
  if ($('footerSheetLink')) $('footerSheetLink').href = sheetLinkPres;

  generateQR();
  if (DOM.presensiStatus) DOM.presensiStatus.textContent = 'Menunggu scan...';

  await loadAllData();

  setInterval(() => { loadAllData(); }, CONFIG.REFRESH_INTERVAL_MS);

  const cameraReady = await checkCameraPermission();
  if (cameraReady) {
    setTimeout(startScanner, 800);
  }
}

document.addEventListener('DOMContentLoaded', init);

window.addEventListener('beforeunload', function () {
  if (State.scanner && State.scanning) {
    State.scanner.stop().then(() => { try { State.scanner.clear(); } catch {} }).catch(() => {});
  }
});
</script>
