<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Presensi Kelas - QR Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --aqua: #7ee8fa;
            --aqua-2: #80ffdb;
            --mint: #a8f0d5;
            --lavender: #c4b5fd;
            --violet: #a78bfa;
            --pink: #f0abfc;
            --rose: #fb7185;
            --peach: #fecaca;
            --sunset: #fed7aa;
            --cream: #fef3c7;
            --text: #1e1b4b;
            --text-soft: #4c4a7a;
            --text-muted: #8886b3;
            --glass: rgba(255, 255, 255, 0.55);
            --glass-strong: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.85);
            --radius: 24px;
            --radius-sm: 16px;
        }

        body {
            font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f4f1ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            color: var(--text);
        }

        /* Aurora background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 15% 20%, rgba(126, 232, 250, 0.55), transparent 60%),
                radial-gradient(ellipse 55% 50% at 85% 15%, rgba(240, 171, 252, 0.5), transparent 60%),
                radial-gradient(ellipse 60% 55% at 75% 85%, rgba(168, 240, 213, 0.5), transparent 60%),
                radial-gradient(ellipse 55% 50% at 20% 90%, rgba(196, 181, 253, 0.5), transparent 60%),
                radial-gradient(ellipse 40% 40% at 50% 50%, rgba(254, 215, 170, 0.35), transparent 70%),
                linear-gradient(135deg, #fef5ff 0%, #f0f4ff 50%, #f0fffb 100%);
            z-index: -2;
            animation: auroraShift 20s ease-in-out infinite;
        }

        @keyframes auroraShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(20deg); }
        }

        /* Floating orbs */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle 200px at 10% 30%, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(circle 180px at 90% 60%, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(circle 150px at 40% 80%, rgba(255, 255, 255, 0.4), transparent);
            pointer-events: none;
            z-index: -1;
            animation: orbFloat 15s ease-in-out infinite;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 20px); }
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 32px;
            padding: 28px 22px 22px;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow:
                0 20px 60px rgba(167, 139, 250, 0.15),
                0 8px 32px rgba(126, 232, 250, 0.12),
                inset 0 1px 1px rgba(255, 255, 255, 0.9),
                inset 0 -1px 1px rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 1;
            animation: containerIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ---- Header ---- */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .icon-circle {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #7ee8fa 0%, #80ffdb 50%, #a78bfa 100%);
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            color: white;
            box-shadow:
                0 12px 40px rgba(126, 232, 250, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.7) inset,
                0 0 80px rgba(167, 139, 250, 0.3);
            position: relative;
            animation: iconFloat 4s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(2deg); }
        }

        .icon-circle::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 34px;
            background: conic-gradient(from 0deg, #7ee8fa, #f0abfc, #a8f0d5, #fed7aa, #7ee8fa);
            opacity: 0.3;
            filter: blur(15px);
            z-index: -1;
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        h1 {
            color: var(--text);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 8px;
            line-height: 1.1;
            background: linear-gradient(135deg, #4c4a7a 0%, #a78bfa 50%, #7ee8fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-soft);
            font-size: 12.5px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.6);
            padding: 7px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 12px rgba(167, 139, 250, 0.1);
            backdrop-filter: blur(10px);
        }

        .subtitle i {
            font-size: 10px;
            color: var(--violet);
        }

        /* ---- QR Display ---- */
        .qr-wrapper {
            background: var(--glass-strong);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 18px;
            width: 100%;
            text-align: center;
            position: relative;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow:
                0 12px 40px rgba(167, 139, 250, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 1);
            overflow: hidden;
        }

        .qr-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(126, 232, 250, 0.15), rgba(240, 171, 252, 0.15), transparent 30%);
            animation: rotate 6s linear infinite;
            z-index: 0;
        }

        #qrImage {
            width: 200px;
            height: 200px;
            display: block;
            border-radius: 14px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            background: white;
            padding: 8px;
            box-shadow: 0 4px 20px rgba(167, 139, 250, 0.15);
        }

        .qr-wrapper .qr-label {
            color: var(--text-soft);
            font-size: 12px;
            font-weight: 600;
            margin-top: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(126, 232, 250, 0.25), rgba(167, 139, 250, 0.25));
            padding: 7px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 1;
        }

        .qr-wrapper .qr-label i {
            color: #06b6d4;
        }

        /* ---- Buttons ---- */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 12.5px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            flex: 1;
            justify-content: center;
            min-width: 0;
            color: var(--text);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.5), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(126, 232, 250, 0.6), rgba(128, 255, 219, 0.6));
            box-shadow: 0 6px 20px rgba(126, 232, 250, 0.35);
        }

        .btn-primary:hover {
            box-shadow: 0 12px 32px rgba(126, 232, 250, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.6), rgba(196, 181, 253, 0.6));
            color: #3d2c8d;
            box-shadow: 0 6px 20px rgba(167, 139, 250, 0.35);
        }

        .btn-secondary:hover {
            box-shadow: 0 12px 32px rgba(167, 139, 250, 0.5);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 6px 20px rgba(167, 139, 250, 0.1);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.75);
            box-shadow: 0 12px 32px rgba(167, 139, 250, 0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, rgba(168, 240, 213, 0.7), rgba(126, 232, 250, 0.7));
            box-shadow: 0 6px 20px rgba(168, 240, 213, 0.4);
        }

        .btn-success:hover {
            box-shadow: 0 12px 32px rgba(168, 240, 213, 0.55);
        }

        /* ---- Divider ---- */
        .divider {
            display: flex;
            align-items: center;
            margin: 22px 0 14px;
            gap: 14px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.4), transparent);
        }

        /* ---- Generate QR Section ---- */
        .qr-generate-section {
            padding: 4px 0 8px 0;
        }

        .qr-generate-section .qr-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .qr-generate-section .qr-label i {
            color: var(--violet);
            font-size: 14px;
            background: rgba(167, 139, 250, 0.15);
            width: 28px;
            height: 28px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .qr-generate-section .qr-input-group {
            display: flex;
            gap: 10px;
        }

        .qr-generate-section .qr-input-group input {
            flex: 1;
            padding: 13px 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.6);
            color: var(--text);
            transition: all 0.3s;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: inset 0 2px 6px rgba(167, 139, 250, 0.08);
        }

        .qr-generate-section .qr-input-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(167, 139, 250, 0.6);
            box-shadow:
                0 0 0 4px rgba(167, 139, 250, 0.15),
                inset 0 2px 6px rgba(167, 139, 250, 0.08);
        }

        .qr-generate-section .qr-input-group input::placeholder {
            color: var(--text-muted);
            font-family: 'Sora', sans-serif;
            font-weight: 400;
        }

        .qr-generate-section .qr-input-group button {
            padding: 13px 22px;
            background: linear-gradient(135deg, #a78bfa 0%, #7ee8fa 100%);
            color: white;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
            box-shadow: 0 6px 24px rgba(167, 139, 250, 0.35);
        }

        .qr-generate-section .qr-input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 36px rgba(167, 139, 250, 0.5);
        }

        .qr-generate-section .qr-input-group button:active {
            transform: translateY(0);
        }

        /* ---- QR Preview ---- */
        .qr-preview {
            margin-top: 14px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            text-align: center;
            display: none;
            box-shadow:
                0 12px 40px rgba(167, 139, 250, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 1);
        }

        .qr-preview.show {
            display: block !important;
            animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.94) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .qr-preview img {
            max-width: 160px;
            height: auto;
            border-radius: 14px;
            background: white;
            padding: 10px;
            box-shadow: 0 8px 24px rgba(167, 139, 250, 0.2);
        }

        .qr-preview .qr-info {
            margin-top: 14px;
            font-size: 12.5px;
            color: var(--text-soft);
            line-height: 1.8;
            font-family: 'JetBrains Mono', monospace;
        }

        .qr-preview .qr-info strong {
            color: var(--text);
            font-weight: 700;
        }

        .qr-preview .qr-actions {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .qr-preview .qr-actions button {
            padding: 9px 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
        }

        .qr-preview .qr-actions .btn-download {
            background: linear-gradient(135deg, #7ee8fa, #80ffdb);
            color: var(--text);
            box-shadow: 0 4px 16px rgba(126, 232, 250, 0.35);
        }

        .qr-preview .qr-actions .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(126, 232, 250, 0.5);
        }

        .qr-preview .qr-actions .btn-close {
            background: rgba(255, 255, 255, 0.6);
            color: var(--text);
        }

        .qr-preview .qr-actions .btn-close:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        /* ---- Scanner ---- */
        .scanner-area {
            position: relative;
            background: #1e1b4b;
            border-radius: var(--radius);
            margin-top: 14px;
            min-height: 300px;
            width: 100%;
            overflow: hidden;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow:
                0 12px 40px rgba(167, 139, 250, 0.2),
                inset 0 1px 1px rgba(255, 255, 255, 0.3);
        }

        #qr-reader {
            width: 100% !important;
            min-height: 300px;
            background: #1e1b4b;
            position: relative;
        }

        #qr-reader video {
            width: 100% !important;
            height: auto !important;
            border-radius: 0 !important;
            display: block !important;
        }

        #qr-reader > div:not(:first-child) {
            display: none !important;
        }

        #qr-reader > div:first-child {
            width: 100% !important;
            height: auto !important;
        }

        #qr-reader > div:first-child > div:first-child {
            width: 100% !important;
            height: auto !important;
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .scanner-overlay .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 62%;
            height: 42%;
            border: 2px solid rgba(126, 232, 250, 0.7);
            border-radius: 20px;
            box-shadow:
                0 0 0 4000px rgba(30, 27, 75, 0.65),
                0 0 40px rgba(126, 232, 250, 0.5),
                inset 0 0 40px rgba(126, 232, 250, 0.15);
            animation: framePulse 2.5s ease-in-out infinite;
        }

        @keyframes framePulse {
            0%, 100% { box-shadow: 0 0 0 4000px rgba(30, 27, 75, 0.65), 0 0 40px rgba(126, 232, 250, 0.5), inset 0 0 40px rgba(126, 232, 250, 0.15); }
            50% { box-shadow: 0 0 0 4000px rgba(30, 27, 75, 0.65), 0 0 60px rgba(126, 232, 250, 0.7), inset 0 0 60px rgba(126, 232, 250, 0.25); }
        }

        .scanner-overlay .scan-frame .corner {
            position: absolute;
            width: 28px;
            height: 28px;
            border-color: #7ee8fa;
            border-style: solid;
            border-width: 0;
            filter: drop-shadow(0 0 8px rgba(126, 232, 250, 0.8));
        }

        .corner-tl { top: -2px; left: -2px; border-top-width: 4px; border-left-width: 4px; border-radius: 8px 0 0 0; }
        .corner-tr { top: -2px; right: -2px; border-top-width: 4px; border-right-width: 4px; border-radius: 0 8px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom-width: 4px; border-left-width: 4px; border-radius: 0 0 0 8px; }
        .corner-br { bottom: -2px; right: -2px; border-bottom-width: 4px; border-right-width: 4px; border-radius: 0 0 8px 0; }

        .scanner-overlay .scan-line {
            position: absolute;
            top: 30%;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #7ee8fa, #f0abfc, #80ffdb, transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(126, 232, 250, 0.8), 0 0 40px rgba(240, 171, 252, 0.5);
        }

        @keyframes scanMove {
            0% { top: 30%; opacity: 0.4; }
            50% { top: 70%; opacity: 1; }
            100% { top: 30%; opacity: 0.4; }
        }

        .scanner-overlay .scan-text {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 11.5px;
            font-weight: 600;
            background: rgba(30, 27, 75, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 9px 18px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(126, 232, 250, 0.4);
            z-index: 15;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(126, 232, 250, 0.3);
        }

        .scanner-overlay .scan-text i {
            color: #7ee8fa;
            font-size: 13px;
            animation: pulseIcon 1.5s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* ---- Scanner Controls ---- */
        .scanner-controls {
            display: flex;
            gap: 10px;
            padding: 14px 0 0;
        }

        .scanner-controls button {
            flex: 1;
            padding: 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text);
        }

        .scanner-controls button:hover {
            transform: translateY(-2px);
        }

        .scanner-controls button:active {
            transform: translateY(0);
        }

        .btn-scan {
            background: linear-gradient(135deg, #7ee8fa 0%, #80ffdb 100%);
            box-shadow: 0 6px 24px rgba(126, 232, 250, 0.4);
        }

        .btn-scan:hover {
            box-shadow: 0 12px 36px rgba(126, 232, 250, 0.55);
        }

        .btn-scan.stop {
            background: linear-gradient(135deg, #fb7185 0%, #f0abfc 100%);
            color: white;
            box-shadow: 0 6px 24px rgba(251, 113, 133, 0.4);
        }

        .btn-flash {
            background: rgba(255, 255, 255, 0.55);
            color: var(--text);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            flex: 0.4;
        }

        .btn-flash:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .btn-flash.active {
            background: linear-gradient(135deg, #fed7aa, #fef3c7);
            box-shadow: 0 6px 24px rgba(254, 215, 170, 0.5);
        }

        /* ---- Status ---- */
        #status {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
            line-height: 1.5;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px rgba(167, 139, 250, 0.15);
        }

        #status i {
            font-size: 18px;
            flex-shrink: 0;
        }

        #status.success {
            display: flex;
            background: rgba(168, 240, 213, 0.7);
            color: #065f46;
        }

        #status.error {
            display: flex;
            background: rgba(254, 202, 202, 0.75);
            color: #991b1b;
        }

        #status.info {
            display: flex;
            background: rgba(196, 181, 253, 0.6);
            color: #4c1d95;
        }

        #status.warning {
            display: flex;
            background: rgba(254, 215, 170, 0.75);
            color: #92400e;
        }

        /* ---- Data Section ---- */
        .data-section {
            margin-top: 18px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            overflow: hidden;
            box-shadow:
                0 12px 40px rgba(167, 139, 250, 0.12),
                inset 0 1px 1px rgba(255, 255, 255, 1);
        }

        .data-section .data-header {
            padding: 16px 18px;
            background: linear-gradient(135deg, rgba(126, 232, 250, 0.25), rgba(240, 171, 252, 0.25), rgba(196, 181, 253, 0.25));
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-section .data-header .title {
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .data-section .data-header .title i {
            color: var(--violet);
            font-size: 14px;
        }

        .data-section .data-header .count {
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 8px rgba(167, 139, 250, 0.15);
            font-family: 'JetBrains Mono', monospace;
        }

        .data-section .table-wrapper {
            max-height: 220px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.3);
        }

        .data-section .table-wrapper::-webkit-scrollbar {
            width: 6px;
        }

        .data-section .table-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .data-section .table-wrapper::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #7ee8fa, #a78bfa);
            border-radius: 6px;
        }

        .data-section table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-section table th {
            padding: 11px 12px;
            text-align: left;
            color: var(--text-soft);
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.9);
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .data-section table td {
            padding: 11px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            color: var(--text-soft);
            font-weight: 500;
        }

        .data-section table tr:hover td {
            background: rgba(255, 255, 255, 0.7);
        }

        .data-section table tr:nth-child(even) td {
            background: rgba(255, 255, 255, 0.35);
        }

        .data-section table .status-hadir {
            color: #065f46;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(168, 240, 213, 0.7);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 10.5px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 8px rgba(168, 240, 213, 0.4);
        }

        .data-section table .status-belum {
            color: var(--text-muted);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 10.5px;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        /* ---- Connection Status ---- */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            margin-top: 12px;
            justify-content: center;
            color: var(--text-soft);
            box-shadow: 0 4px 16px rgba(167, 139, 250, 0.12);
        }

        .connection-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            position: relative;
        }

        .connection-status .dot.online {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.7);
        }

        .connection-status .dot.offline {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.7);
            animation: pulseDot 1s ease-in-out infinite;
        }

        .connection-status .dot.checking {
            background: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.7);
            animation: pulseDot 0.8s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* ---- Footer ---- */
        .footer-note {
            margin-top: 18px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.8;
        }

        .footer-note i {
            color: var(--violet);
        }

        .footer-note a {
            color: var(--violet);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .footer-note a:hover {

            text-decoration: underline;
        }

        .footer-note .presensi-status-line {
            font-size: 10.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.6);

            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        /* ---- Loading ---- */
        .loading-text {
            text-align: center;
            padding: 28px 20px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        .loading-text i {
            margin-right: 8px;
            color: var(--violet);
        }

        /* ---- Mobile ---- */
        @media (max-width: 480px) {
            body { padding: 12px 10px; }

            .container {
                padding: 20px 16px 16px;
                border-radius: 26px;
            }

            .icon-circle {
                width: 64px;
                height: 64px;
                font-size: 28px;
                border-radius: 22px;
            }

            h1 { font-size: 22px; }

            #qrImage {
                width: 170px;
                height: 170px;
            }

            .btn-group {
                flex-direction: column;
                gap: 8px;
            }

            .btn {
                font-size: 12px;
                padding: 11px 16px;

            }

            .scanner-area { min-height: 220px; }
            #qr-reader { min-height: 220px; }

            .data-section table { font-size: 11px; }
            .data-section table th,
            .data-section table td { padding: 8px 10px; }

            .scanner-overlay .scan-text {
                font-size: 10px;

            }

            .qr-generate-section .qr-input-group {
                flex-direction: column;
            }

            .qr-generate-section .qr-input-group button {
                width: 100%;
            }

            .scanner-controls button {
                padding: 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="icon-circle">
                <i class="fas fa-qrcode"></i>
            </div>
            <h1>Presensi Kelas</h1>
            <p class="subtitle">
                <i class="fas fa-sparkles"></i>
                Scan QR Code untuk Absensi
                <i class="fas fa-sparkles"></i>
            </p>
        </div>

        <div class="qr-wrapper">
            <img id="qrImage" src="" alt="QR Code Presensi" />
            <div class="qr-label">
                <i class="fas fa-check-circle"></i>
                Scan untuk hadir
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-success" onclick="loadAllData()">
                <i class="fas fa-sync-alt"></i> Refresh Data
            </button>
            <button class="btn btn-outline" onclick="downloadQR()">
                <i class="fas fa-download"></i> Download QR
            </button>
            <a id="sheetLink" href="#" target="_blank" class="btn btn-secondary">
                <i class="fas fa-external-link-alt"></i> Buka Sheet
            </a>
        </div>

        <div class="qr-generate-section">

            <div class="qr-input-group">
                <input type="text" id="qrNimInput" placeholder="Masukkan NIM" maxlength="20">
                <button onclick="generateQRCode()">

            </div>
            <div class="qr-preview" id="qrPreview">

                <div class="qr-info" id="qrInfo"></div>
                <div class="qr-actions">

                        <i class="fas fa-download"></i> Download

                    <button class="btn-close" onclick="closeQRPreview()">
                        <i class="fas fa-times"></i> Tutup
                    </button>

        <div class="connection-status" id="connectionStatus">
            <span class="dot checking" id="statusDot"></span>
            <span id="statusLabel">Mengecek koneksi...</span>
        </div>

        <div id="status"></div>

        <div class="divider">
            <span>scan QR Code</span>
        </div>

        <div class="scanner-area" id="scannerArea">

            <div class="scanner-overlay">
                <div class="scan-frame">
                    <div class="corner corner-tl"></div>
                    <div class="corner corner-tr"></div>
                    <div class="corner corner-bl"></div>
                    <div class="corner corner-br"></div>
                    <div class="scan-line"></div>
                </div>
                <div class="scan-text">
                    <i class="fas fa-qrcode"></i>
                    <span id="scanStatusText">Arahkan ke QR Code</span>

        <div class="scanner-controls">
            <button class="btn-scan" id="btnStartScan" onclick="toggleScanner()">

        <div class="data-section">
            <div class="data-header">
                <div class="title">
                    <i class="fas fa-users"></i> Daftar Mahasiswa
                </div>

            </div>
            <div class="table-wrapper" id="tableWrapper">
                <div class="loading-text" id="loadingData">
                    <i class="fas fa-spinner fa-spin"></i> Memuat data...
                </div>
                <table id="dataTable" style="display:none;">
                    <thead>
                        <tr>
                            <th>NIM</th>
                            <th>Nama</th>

            <a id="footerSheetLink" href="#" target="_blank">Google Sheets</a>

            <span class="presensi-status-line">
                <i class="fas fa-check-circle" style="color:#a78bfa;"></i>
                Status: <span id="presensiStatus">Menunggu scan</span>
            </span>
        </div>
    </div>

<script>
/* ===================================================================
   FRONTEND — Presensi Kelas QR
   Data PERMANEN di Google Sheets (lihat file Code.gs terpisah).
   localStorage hanya sebagai CACHE offline.
   =================================================================== */

/* ---------------- KONFIGURASI ---------------- */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwFaiXWeQmp9D1U6YKlNM2u28Dgp8mcnYmzWxoWXH_FS3Po3oWJt1-kknsCZ_yRDranPQ/exec',
  SHEET_URL: 'https://docs.google.com/spreadsheets/d/1PXOSZAXZNg7hvX-33DglZlM3saj4yclUhiYepiFNYhI/edit?gid=0#gid=0',
  SHEET_GID_MAHASISWA: '0',
  SHEET_GID_PRESENSI: '646034675',
  CACHE_KEY_MAHASISWA: 'presensi_mahasiswa_cache_v2',
  CACHE_KEY_PRESENSI: 'presensi_hari_ini_cache_v2',
  REFRESH_INTERVAL_MS: 30000,
  RESCAN_DELAY_MS: 2500
};

/* ---------------- STATE ---------------- */
const State = {
  scanner: null,
  scanning: false,
  flashOn: false,
  processing: false,
  mahasiswa: [],
  presensiHariIni: {},
  isOnline: false,
  tanggalHariIni: ''
};

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const DOM = {
  status: $('status'),
  scanStatus: $('scanStatusText'),
  presensiStatus: $('presensiStatus'),
  btnStartScan: $('btnStartScan'),
  btnFlash: $('btnFlash'),
  qrImage: $('qrImage'),
  tableBody: $('tableBody'),
  dataTable: $('dataTable'),
  loadingData: $('loadingData'),
  totalMahasiswa: $('totalMahasiswa'),
  statusDot: $('statusDot'),
  statusLabel: $('statusLabel'),
  qrNimInput: $('qrNimInput'),
  qrResultImage: $('qrResultImage'),
  qrInfo: $('qrInfo'),
  qrPreview: $('qrPreview')
};

/* ================== UTIL ================== */
function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function setConnectionStatus(status, message) {
  if (!DOM.statusDot || !DOM.statusLabel) return;
  DOM.statusDot.className = 'dot ' + status;
  DOM.statusLabel.textContent = message;
  State.isOnline = (status === 'online');
}

let statusTimer;
function showStatus(message, type = 'info', duration = 4000) {
  if (!DOM.status) return;
  const iconMap = {
    success: 'fa-check-circle',
    error: 'fa-exclamation-circle',
    warning: 'fa-triangle-exclamation',
    info: 'fa-info-circle'
  };
  DOM.status.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
  DOM.status.className = type;
  DOM.status.style.display = 'flex';
  clearTimeout(statusTimer);
  if (duration > 0) {
    statusTimer = setTimeout(() => { DOM.status.style.display = 'none'; }, duration);
  }
}

/* ================== API HELPER ================== */
async function apiGet(action, params = {}) {
  const qs = new URLSearchParams({ action, t: Date.now(), ...params });
  const res = await fetch(CONFIG.API_URL + '?' + qs.toString(), {
    method: 'GET',
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function apiPost(action, payload = {}) {
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

/* ================== CACHE ================== */
function loadCacheMahasiswa() {
  try {
    const raw = localStorage.getItem(CONFIG.CACHE_KEY_MAHASISWA);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function saveCacheMahasiswa(data) {
  try { localStorage.setItem(CONFIG.CACHE_KEY_MAHASISWA, JSON.stringify(data)); } catch {}
}

function loadCachePresensi() {
  try {
    const raw = localStorage.getItem(CONFIG.CACHE_KEY_PRESENSI);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed.tanggal !== todayStr()) return null;
    return parsed.map || {};
  } catch { return null; }
}

function saveCachePresensi(map) {
  try {
    localStorage.setItem(CONFIG.CACHE_KEY_PRESENSI, JSON.stringify({
      tanggal: todayStr(),
      map
    }));
  } catch {}
}

/* ================== LOAD DATA ================== */
async function checkConnection() {
  setConnectionStatus('checking', 'Mengecek koneksi...');
  try {
    const json = await apiGet('ping');
    if (json.success) {
      setConnectionStatus('online', '✅ Terhubung ke server');
      return true;
    }
    throw new Error(json.error || 'Ping gagal');
  } catch (err) {
    setConnectionStatus('offline', '📴 Offline');
    return false;
  }
}

async function loadAllData() {
  State.tanggalHariIni = todayStr();

  const cachedMhs = loadCacheMahasiswa();
  if (cachedMhs.length) {
    State.mahasiswa = cachedMhs;
    State.presensiHariIni = loadCachePresensi() || {};
    renderDataTable();
  } else {
    if (DOM.loadingData) DOM.loadingData.style.display = 'block';
    if (DOM.dataTable) DOM.dataTable.style.display = 'none';
  }

  const online = await checkConnection();
  if (!online) {
    if (!cachedMhs.length) {
      showEmptyState('offline');
    } else {
      showStatus('📂 Mode offline — data dari cache', 'warning', 3000);
    }
    return;
  }

  try {
    const mhsRes = await apiGet('get_all');
    if (mhsRes.success && Array.isArray(mhsRes.data)) {
      State.mahasiswa = mhsRes.data;
      saveCacheMahasiswa(mhsRes.data);
    } else {
      showStatus('⚠️ ' + (mhsRes.error || 'Gagal memuat mahasiswa'), 'warning', 3500);
    }

    const presRes = await apiGet('get_presensi', { tanggal: todayStr() });
    if (presRes.success && Array.isArray(presRes.data)) {
      const map = {};
      presRes.data.forEach(p => { if (p.nim) map[String(p.nim).trim()] = p; });
      State.presensiHariIni = map;
      saveCachePresensi(map);
    }

    renderDataTable();
    showStatus(`✅ ${State.mahasiswa.length} mahasiswa · ${Object.keys(State.presensiHariIni).length} hadir hari ini`, 'success', 2500);
  } catch (err) {
    console.error(err);
    if (State.mahasiswa.length) {
      showStatus('⚠️ Gagal sinkron server — pakai cache', 'warning', 3500);
      renderDataTable();
    } else {
      showEmptyState('error', err.message);
    }
  }
}

/* ================== RENDER ================== */
function renderDataTable() {
  if (!DOM.tableBody || !DOM.dataTable || !DOM.loadingData) return;
  DOM.tableBody.innerHTML = '';

  if (!State.mahasiswa.length) {
    showEmptyState('empty');
    return;
  }

  State.mahasiswa.forEach(mhs => {
    const nim = String(mhs.nim || '').trim();
    const hadir = !!State.presensiHariIni[nim];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${escapeHtml(nim || '-')}</strong></td>
      <td>${escapeHtml(mhs.nama || '-')}</td>
      <td>${escapeHtml(mhs.kelas || '-')}</td>
      <td>${escapeHtml(mhs.jurusan || '-')}</td>
      <td>
        <span class="${hadir ? 'status-hadir' : 'status-belum'}">
          <i class="fas ${hadir ? 'fa-check-circle' : 'fa-circle'}"></i>
          ${hadir ? 'Hadir' : 'Belum'}
        </span>
      </td>`;
    DOM.tableBody.appendChild(tr);
  });

  DOM.loadingData.style.display = 'none';
  DOM.dataTable.style.display = 'table';
  const totalHadir = Object.keys(State.presensiHariIni).length;
  DOM.totalMahasiswa.textContent = `${totalHadir} / ${State.mahasiswa.length} mahasiswa`;
}

function showEmptyState(kind, detail = '') {
  if (!DOM.loadingData) return;
  DOM.dataTable.style.display = 'none';
  DOM.loadingData.style.display = 'block';
  DOM.totalMahasiswa.textContent = '0 mahasiswa';

  const btnStyle = 'padding:10px 22px;background:linear-gradient(135deg,#a78bfa,#7ee8fa);color:white;border:1.5px solid rgba(255,255,255,0.9);border-radius:12px;cursor:pointer;font-weight:700;font-family:inherit;font-size:12px;box-shadow:0 6px 20px rgba(167,139,250,0.35);';

  if (kind === 'offline') {
    DOM.loadingData.innerHTML = `
      <i class="fas fa-wifi" style="color:#ef4444;font-size:28px;display:block;margin-bottom:14px;"></i>
      <strong style="color:#991b1b;font-size:14px;">Tidak Ada Koneksi</strong><br><br>
      <span style="color:var(--text-muted);font-size:12px;">Tidak ada internet & tidak ada cache.</span><br><br>
      <button onclick="loadAllData()" style="${btnStyle}">
        <i class="fas fa-sync-alt"></i> Coba Lagi
      </button>`;
  } else if (kind === 'empty') {
    DOM.loadingData.innerHTML = `
      <i class="fas fa-info-circle" style="color:#f59e0b;font-size:24px;display:block;margin-bottom:14px;"></i>
      <strong style="color:#92400e;font-size:14px;">Belum ada data mahasiswa</strong><br><br>
      <span style="color:var(--text-muted);font-size:12px;">Tambahkan data di sheet "Mahasiswa".</span><br><br>
      <a href="${CONFIG.SHEET_URL}" target="_blank" style="${btnStyle}text-decoration:none;display:inline-block;">
        <i class="fas fa-external-link-alt"></i> Buka Google Sheets
      </a>`;
  } else {
    DOM.loadingData.innerHTML = `
      <i class="fas fa-exclamation-circle" style="color:#ef4444;font-size:28px;display:block;margin-bottom:14px;"></i>
      <strong style="color:#991b1b;font-size:14px;">Gagal Memuat Data</strong><br><br>
      <span style="color:var(--text-muted);font-size:12px;">${escapeHtml(detail)}</span><br><br>
      <button onclick="loadAllData()" style="${btnStyle}">
        <i class="fas fa-sync-alt"></i> Coba Lagi
      </button>`;
  }
}

/* ================== QR UMUM ================== */
function generateQR() {
  if (!DOM.qrImage) return;
  const qrData = {
    nim: 'ABSENSI-KELAS',
    nama: 'Presensi Kelas',
    kelas: 'Semua',
    jurusan: 'Semua',
    link_sheet: CONFIG.SHEET_URL,
    timestamp: new Date().toISOString()
  };
  DOM.qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(JSON.stringify(qrData))}`;
}

function downloadQR() {
  if (!DOM.qrImage.src) { alert('QR Code belum siap.'); return; }
  const a = document.createElement('a');
  a.download = 'qr-presensi-kelas.png';
  a.href = DOM.qrImage.src;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ================== QR PER MAHASISWA ================== */
function generateQRCode() {
  const nim = DOM.qrNimInput.value.trim();
  if (!nim) { showStatus('❌ Masukkan NIM terlebih dahulu', 'error'); DOM.qrNimInput.focus(); return; }
  if (nim.length < 3) { showStatus('❌ NIM minimal 3 karakter', 'error'); return; }

  const mhs = State.mahasiswa.find(m => String(m.nim).trim() === nim);
  if (!mhs) { showStatus(`❌ NIM ${escapeHtml(nim)} tidak terdaftar!`, 'error'); return; }

  const qrData = {
    nim: mhs.nim,
    nama: mhs.nama,
    kelas: mhs.kelas,
    jurusan: mhs.jurusan,
    link_sheet: CONFIG.SHEET_URL,
    timestamp: new Date().toISOString()
  };
  DOM.qrResultImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(JSON.stringify(qrData))}`;
  DOM.qrInfo.innerHTML = `
    <strong>NIM:</strong> ${escapeHtml(mhs.nim)} &bull;
    <strong>Nama:</strong> ${escapeHtml(mhs.nama)}<br>
    <strong>Kelas:</strong> ${escapeHtml(mhs.kelas)} &bull;
    <strong>Jurusan:</strong> ${escapeHtml(mhs.jurusan)}
    <div style="margin-top:8px;font-size:12px;color:#06b6d4;font-weight:600;">
      <i class="fas fa-check-circle"></i> Scan QR untuk presensi
    </div>`;
  DOM.qrPreview.classList.add('show');
  showStatus(`✅ QR Code dibuat untuk ${escapeHtml(mhs.nama)} (${escapeHtml(nim)})`, 'success');
}

function downloadQRCode() {
  if (!DOM.qrResultImage.src) { showStatus('❌ Tidak ada QR Code', 'error'); return; }
  const a = document.createElement('a');
  const nim = DOM.qrNimInput.value.trim() || 'mahasiswa';
  a.download = `qr-code-${nim}.png`;
  a.href = DOM.qrResultImage.src;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showStatus('✅ QR Code berhasil didownload!', 'success');
}

function closeQRPreview() {
  DOM.qrPreview.classList.remove('show');
  DOM.qrNimInput.value = '';
}

/* ================== SCANNER ================== */
function toggleScanner() {
  if (State.scanning) stopScanner();
  else startScanner();
}

function startScanner() {
  if (State.scanning) return;

  if (State.scanner) {
    try { State.scanner.clear(); } catch {}
    State.scanner = null;
  }

  const readerEl = $('qr-reader');
  if (readerEl) readerEl.innerHTML = '';

  if (DOM.btnStartScan) {
    DOM.btnStartScan.classList.add('stop');
    DOM.btnStartScan.innerHTML = '<i class="fas fa-stop"></i> Stop Scan';
  }

  try {
    State.scanner = new Html5Qrcode("qr-reader", {
      verbose: false,
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
    });

    const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
    const onSuccess = (text) => onScanSuccess(text);
    const onError = () => {};

    State.scanner.start({ facingMode: "environment" }, config, onSuccess, onError)
      .then(() => onScannerStarted('📷 Kamera belakang aktif'))
      .catch(() => {
        State.scanner.start({ facingMode: "user" }, config, onSuccess, onError)
          .then(() => onScannerStarted('📷 Kamera depan aktif'))
          .catch(err2 => {
            showStatus('❌ Gagal akses kamera: ' + err2.message, 'error', 0);
            resetScannerButton();
          });
      });
  } catch (err) {
    showStatus('❌ Gagal inisialisasi scanner', 'error', 0);
    resetScannerButton();
  }
}

function onScannerStarted(msg) {
  State.scanning = true;
  if (DOM.scanStatus) DOM.scanStatus.textContent = '🔍 Mendeteksi QR Code...';
  if (DOM.presensiStatus) DOM.presensiStatus.textContent = 'Mendeteksi...';
  showStatus(msg, 'info', 3000);
}

function stopScanner() {
  if (State.scanner && State.scanning) {
    State.scanner.stop()
      .then(() => {
        try { State.scanner.clear(); } catch {}
        State.scanner = null;
        State.scanning = false;
        resetScannerButton();
        if (DOM.scanStatus) DOM.scanStatus.textContent = '⏸ Scanner berhenti';
      })
      .catch(() => {});
  } else {
    State.scanning = false;
    resetScannerButton();
  }
}

function resetScannerButton() {
  if (!DOM.btnStartScan) return;
  DOM.btnStartScan.classList.remove('stop');
  DOM.btnStartScan.innerHTML = '<i class="fas fa-play"></i> <span id="btnScanLabel">Mulai Scan</span>';
}

/* ================== SCAN SUCCESS ================== */
function onScanSuccess(decodedText) {
  if (State.processing) return;
  State.processing = true;

  if (State.scanner && State.scanning) {
    State.scanner.stop()
      .then(() => { try { State.scanner.clear(); } catch {} State.scanner = null; State.scanning = false; resetScannerButton(); })
      .catch(() => {});
  }

  processPresensi(decodedText);
}

/* ================== PROSES PRESENSI ================== */
async function processPresensi(qrData) {
  const tanggal = todayStr();
  try {
    showStatus('⏳ Memproses presensi...', 'info', 0);

    let nim = '';
    try {
      const parsed = JSON.parse(qrData);
      nim = String(parsed.nim || '').trim();
    } catch {
      nim = String(qrData || '').trim();
    }

    if (!nim || nim.length < 3) {
      showStatus('❌ NIM tidak valid (minimal 3 karakter)', 'error');
      return;
    }

    const mhs = State.mahasiswa.find(m => String(m.nim).trim() === nim);
    if (!mhs) {
      showStatus(`❌ NIM ${escapeHtml(nim)} tidak terdaftar!`, 'error');
      return;
    }

    if (State.presensiHariIni[nim]) {
      showStatus(`⚠️ ${escapeHtml(mhs.nama)} sudah presensi hari ini!`, 'warning');
      if (DOM.scanStatus) DOM.scanStatus.textContent = '⚠️ Sudah presensi';
      if (DOM.presensiStatus) DOM.presensiStatus.textContent = '⚠️ Sudah hadir';
      return;
    }

    const payload = {
      nim,
      nama: mhs.nama || '',
      kelas: mhs.kelas || '',
      jurusan: mhs.jurusan || '',
      mataKuliah: 'Presensi Kelas',
      status: 'Hadir'
    };

    let result;
    try {
      result = await apiPost('presensi', payload);
    } catch (netErr) {
      State.presensiHariIni[nim] = { nim, tanggal, offline: true, waktu: new Date().toLocaleString('id-ID') };
      saveCachePresensi(State.presensiHariIni);
      renderDataTable();
      showStatus(`📴 Offline — ${escapeHtml(mhs.nama)} dicatat lokal. Sinkronkan saat online.`, 'warning', 5000);
      if (DOM.scanStatus) DOM.scanStatus.textContent = '📴 Tersimpan lokal';
      return;
    }

    if (result.success) {
      State.presensiHariIni[nim] = { nim, tanggal, waktu: result.waktu || '', nama: mhs.nama };
      saveCachePresensi(State.presensiHariIni);
      renderDataTable();
      showStatus(`✅ ${escapeHtml(mhs.nama)} HADIR — tersimpan di Google Sheets`, 'success', 3500);
      if (DOM.scanStatus) DOM.scanStatus.textContent = '✅ Hadir!';
      if (DOM.presensiStatus) DOM.presensiStatus.textContent = '✅ Hadir';
    } else if (result.already) {
      State.presensiHariIni[nim] = { nim, tanggal, waktu: result.data?.waktu || '' };
      saveCachePresensi(State.presensiHariIni);
      renderDataTable();
      showStatus(`⚠️ ${escapeHtml(mhs.nama)} sudah presensi hari ini (server)`, 'warning', 3500);
      if (DOM.scanStatus) DOM.scanStatus.textContent = '⚠️ Sudah presensi';
    } else {
      showStatus('❌ ' + (result.error || 'Gagal menyimpan presensi'), 'error', 4000);
    }
  } catch (err) {
    console.error(err);
    showStatus('❌ Error: ' + err.message, 'error', 4000);
  } finally {
    setTimeout(() => {
      State.processing = false;
      if (DOM.scanStatus) DOM.scanStatus.textContent = 'Arahkan ke QR Code';
      if (!State.scanning) startScanner();
    }, CONFIG.RESCAN_DELAY_MS);
  }
}

/* ================== FLASH ================== */
async function toggleFlash() {
  State.flashOn = !State.flashOn;
  if (!DOM.btnFlash) return;

  if (State.flashOn) {
    DOM.btnFlash.classList.add('active');
    DOM.btnFlash.innerHTML = '<i class="fas fa-bolt"></i>';
  } else {
    DOM.btnFlash.classList.remove('active');
    DOM.btnFlash.innerHTML = '<i class="fas fa-bolt"></i>';
  }

  try {
    const video = document.querySelector('#qr-reader video');
    if (!video || !video.srcObject) return;
    const track = video.srcObject.getVideoTracks()[0];
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) {
      await track.applyConstraints({ advanced: [{ torch: State.flashOn }] });
    }
  } catch (e) { /* torch tidak didukung */ }
}

/* ================== IZIN KAMERA ================== */
async function checkCameraPermission() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus('❌ Browser tidak mendukung kamera', 'error', 0);
      return false;
    }
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    stream.getTracks().forEach(t => t.stop());
    return true;
  } catch {
    showStatus('❌ Izin kamera diperlukan untuk scan QR Code', 'error', 0);
    return false;
  }
}

/* ================== INIT ================== */
async function init() {
  State.tanggalHariIni = todayStr();

  const sheetLinkPres = CONFIG.SHEET_URL + '#gid=' + CONFIG.SHEET_GID_PRESENSI;
  if ($('sheetLink')) $('sheetLink').href = sheetLinkPres;
  if ($('footerSheetLink')) $('footerSheetLink').href = sheetLinkPres;

  generateQR();
  if (DOM.presensiStatus) DOM.presensiStatus.textContent = 'Menunggu scan...';

  await loadAllData();

  setInterval(() => { loadAllData(); }, CONFIG.REFRESH_INTERVAL_MS);

  const cameraReady = await checkCameraPermission();
  if (cameraReady) {
    setTimeout(startScanner, 800);
  }
}

document.addEventListener('DOMContentLoaded', init);

window.addEventListener('beforeunload', function () {
  if (State.scanner && State.scanning) {
    State.scanner.stop().then(() => { try { State.scanner.clear(); } catch {} }).catch(() => {});
  }
});
</script>
