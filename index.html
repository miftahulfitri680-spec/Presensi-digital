<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Presensi Kelas · QR Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0b1020; --card: #131a2e; --card2: #1e2742;
            --line: rgba(255,255,255,0.08);
            --text: #e8ecf7; --text-soft: #a2adc8; --text-dim: #6b7699;
            --neon: #00ffb2; --neon2: #00d4ff; --hot: #ff2e63; --warn: #ffb547;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 16px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0,255,178,0.08), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0,212,255,0.08), transparent 40%);
            background-attachment: fixed;
        }
        .container { max-width: 480px; margin: 0 auto; }
        .header {
            text-align: center; margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(180deg, var(--card2), var(--card));
            border: 1px solid var(--line);
            border-radius: 20px;
        }
        .header .logo {
            width: 60px; height: 60px; margin: 0 auto 12px;
            background: linear-gradient(135deg, var(--neon), var(--neon2));
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: var(--bg);
            box-shadow: 0 0 30px rgba(0,255,178,0.4);
        }
        .header h1 {
            font-size: 22px; font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--neon));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .header p { color: var(--text-soft); font-size: 13px; }
        .conn {
            display: inline-flex; align-items: center; gap: 8px;
            margin-top: 12px; padding: 6px 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 11px; font-family: 'IBM Plex Mono', monospace;
            color: var(--text-soft);
        }
        .conn .dot { width: 8px; height: 8px; border-radius: 50%; }
        .conn .dot.online { background: var(--neon); box-shadow: 0 0 10px var(--neon); }
        .conn .dot.offline { background: var(--hot); box-shadow: 0 0 10px var(--hot); }
        .conn .dot.checking { background: var(--warn); box-shadow: 0 0 10px var(--warn); animation: blink 0.8s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .stats {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-bottom: 16px;
        }
        .stat {
            background: var(--card); border: 1px solid var(--line);
            border-radius: 16px; padding: 14px;
            position: relative; overflow: hidden;
        }
        .stat::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 2px; background: var(--neon);
        }
        .stat.pink::before { background: var(--hot); }
        .stat .label { font-size: 10px; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 1px;
            font-family: 'IBM Plex Mono', monospace; margin-bottom: 6px; }
        .stat .value { font-size: 26px; font-weight: 800;
            font-family: 'IBM Plex Mono', monospace; }
        .stat .value.neon { color: var(--neon); }
        .stat .value.pink { color: var(--hot); }

        .scanner-box {
            background: var(--card); border: 1px solid var(--line);
            border-radius: 20px; overflow: hidden; margin-bottom: 16px;
        }
        .scanner-header {
            padding: 12px 16px; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid var(--line);
            background: rgba(0,0,0,0.2);
            font-size: 13px; font-weight: 700;
        }
        .scanner-header i { color: var(--neon); }
        .scanner-wrap {
            position: relative; width: 100%; aspect-ratio: 4/3;
            background: #05080f; overflow: hidden;
        }
        #reader { width: 100% !important; height: 100% !important; }
        #reader video { width: 100% !important; height: 100% !important;
            object-fit: cover !important; }
        #reader > div:not(:first-child) { display: none !important; }
        #reader > div:first-child { width: 100% !important; height: 100% !important; }
        #reader > div:first-child > div:first-child { width: 100% !important; height: 100% !important; }

        .scan-frame {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60%; aspect-ratio: 1;
            border-radius: 16px;
            box-shadow: 0 0 0 4000px rgba(5,8,15,0.7);
            pointer-events: none;
        }
        .scan-frame .c {
            position: absolute; width: 28px; height: 28px;
            border-color: var(--neon); border-style: solid; border-width: 0;
            filter: drop-shadow(0 0 8px var(--neon));
        }
        .c.tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-radius: 16px 0 0 0; }
        .c.tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-radius: 0 16px 0 0; }
        .c.bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-radius: 0 0 0 16px; }
        .c.br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 16px 0; }
        .scan-laser {
            position: absolute; left: 4%; right: 4%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
            animation: laser 2.4s infinite; border-radius: 2px;
            box-shadow: 0 0 16px var(--neon);
        }
        @keyframes laser {
            0% { top: 4%; opacity: 0.4; }
            50% { top: 96%; opacity: 1; }
            100% { top: 4%; opacity: 0.4; }
        }
        .scan-status {
            position: absolute; bottom: 12px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75); padding: 7px 16px;
            border-radius: 999px; font-size: 11px;
            border: 1px solid rgba(0,255,178,0.3);
            font-family: 'IBM Plex Mono', monospace;
            white-space: nowrap;
        }
        .scan-status i { color: var(--neon); margin-right: 6px; }

        .scanner-actions {
            display: flex; gap: 8px; padding: 12px;
        }
        .btn {
            padding: 12px 16px; border: none; border-radius: 12px;
            font-family: inherit; font-weight: 700; font-size: 12px;
            cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-scan {
            flex: 1;
            background: linear-gradient(135deg, var(--neon), var(--neon2));
            color: var(--bg);
            box-shadow: 0 4px 20px rgba(0,255,178,0.3);
        }
        .btn-scan.stop {
            background: linear-gradient(135deg, var(--hot), #ff7a9c);
            color: white;
        }
        .btn-flash {
            width: 48px;
            background: rgba(255,255,255,0.05);
            color: var(--text); border: 1px solid var(--line);
        }
        .btn-flash.active {
            background: linear-gradient(135deg, var(--warn), #ffd97a);
            color: var(--bg);
        }

        .roster {
            background: var(--card); border: 1px solid var(--line);
            border-radius: 20px; overflow: hidden;
        }
        .roster-header {
            padding: 14px 16px; display: flex; align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
            background: rgba(0,0,0,0.2);
            font-size: 13px; font-weight: 700;
        }
        .roster-header i { color: var(--neon); margin-right: 6px; }
        .roster-header .count {
            font-size: 11px; color: var(--text-dim);
            font-family: 'IBM Plex Mono', monospace;
        }
        .roster-list { max-height: 400px; overflow-y: auto; padding: 8px; }
        .roster-list::-webkit-scrollbar { width: 4px; }
        .roster-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
        .mhs {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; border-radius: 12px;
            margin-bottom: 4px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .mhs:hover { background: rgba(255,255,255,0.03); }
        .mhs.hadir {
            background: rgba(0,255,178,0.05);
            border-color: rgba(0,255,178,0.2);
        }
        .mhs-avatar {
            width: 38px; height: 38px; border-radius: 12px;
            background: linear-gradient(135deg, var(--card2), var(--card));
            border: 1px solid var(--line);
            display: flex; align-items: center; justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 700; font-size: 13px; color: var(--text-soft);
            flex-shrink: 0;
        }
        .mhs.hadir .mhs-avatar {
            background: linear-gradient(135deg, rgba(0,255,178,0.2), rgba(0,212,255,0.2));
            color: var(--neon);
            border-color: rgba(0,255,178,0.3);
        }
        .mhs-info { flex: 1; min-width: 0; }
        .mhs-name {
            font-size: 13px; font-weight: 600; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .mhs-meta {
            font-size: 10px; color: var(--text-dim);
            font-family: 'IBM Plex Mono', monospace;
            margin-top: 2px;
        }
        .mhs-meta .nim { color: var(--neon2); font-weight: 600; }
        .mhs-status {
            font-size: 10px; font-weight: 700;
            padding: 4px 10px; border-radius: 999px;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 0.5px;
        }
        .mhs-status.hadir {
            background: rgba(0,255,178,0.15); color: var(--neon);
            border: 1px solid rgba(0,255,178,0.3);
        }
        .mhs-status.belum {
            background: rgba(255,255,255,0.05); color: var(--text-dim);
            border: 1px solid var(--line);
        }
        .loading {
            padding: 40px 20px; text-align: center;
            color: var(--text-dim); font-size: 13px;
        }
        .loading i { font-size: 24px; margin-bottom: 10px; display: block; color: var(--neon); }

        .toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: var(--card); padding: 12px 20px;
            border-radius: 14px; border: 1px solid var(--line);
            font-size: 13px; font-weight: 600;
            display: flex; align-items: center; gap: 10px;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: all 0.3s;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            max-width: 90%; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }
        .toast.success { border-color: rgba(0,255,178,0.4); color: var(--neon); }
        .toast.error { border-color: rgba(255,46,99,0.4); color: var(--hot); }
        .toast.warning { border-color: rgba(255,181,71,0.4); color: var(--warn); }
        .toast.info { border-color: rgba(0,212,255,0.4); color: var(--neon2); }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="logo"><i class="fas fa-qrcode"></i></div>
        <h1>Presensi Kelas</h1>
        <p>Scan QR Code untuk Absensi</p>
        <div class="conn" id="connBox">
            <span class="dot checking" id="connDot"></span>
            <span id="connText">Mengecek koneksi...</span>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats">
        <div class="stat">
            <div class="label"><i class="fas fa-check-circle" style="color:var(--neon);"></i> Hadir</div>
            <div class="value neon" id="statHadir">0</div>
        </div>
        <div class="stat pink">
            <div class="label"><i class="fas fa-clock" style="color:var(--hot);"></i> Belum Hadir</div>
            <div class="value pink" id="statBelum">0</div>
        </div>
    </div>

    <!-- SCANNER -->
    <div class="scanner-box">
        <div class="scanner-header">
            <i class="fas fa-camera"></i> QR Scanner
        </div>
        <div class="scanner-wrap">
            <div id="reader"></div>
            <div class="scan-frame">
                <div class="c tl"></div>
                <div class="c tr"></div>
                <div class="c bl"></div>
                <div class="c br"></div>
                <div class="scan-laser"></div>
            </div>
            <div class="scan-status">
                <i class="fas fa-qrcode"></i>
                <span id="scanText">Menyiapkan kamera...</span>
            </div>
        </div>
        <div class="scanner-actions">
            <button class="btn btn-scan" id="btnScan" onclick="toggleScan()">
                <i class="fas fa-play"></i> <span id="btnScanText">Mulai Scan</span>
            </button>
            <button class="btn btn-flash" id="btnFlash" onclick="toggleFlash()">
                <i class="fas fa-bolt"></i>
            </button>
        </div>
    </div>

    <!-- ROSTER -->
    <div class="roster">
        <div class="roster-header">
            <div><i class="fas fa-users"></i> Daftar Mahasiswa</div>
            <div class="count" id="totalText">0</div>
        </div>
        <div class="roster-list" id="rosterList">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                Memuat data mahasiswa...
            </div>
        </div>
    </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   KONFIGURASI — GANTI URL DI BAWAH DENGAN URL KAMU
   =================================================================== */
const CONFIG = {
  // 👇👇👇 GANTI INI DENGAN URL WEB APP KAMU 👇👇👇
  API_URL: 'https://script.google.com/macros/s/AKfycbwYp4E26f42diDjYW_n89Ykjqu_bm-LKj2cO3GOspa0npYVSIgqAdUx8JlUVx-0krT02g/exec',
  
  REFRESH_INTERVAL: 30000,
  RESCAN_DELAY: 2500
};

/* ===== STATE ===== */
const State = {
  scanner: null,
  scanning: false,
  flashOn: false,
  processing: false,
  mahasiswa: [],
  presensi: {},
  tanggal: ''
};

/* ===== DOM ===== */
const $ = id => document.getElementById(id);

/* ===== UTIL ===== */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function initials(n) {
  if (!n) return '?';
  const p = String(n).trim().split(/\s+/);
  return p.length === 1 ? p[0].slice(0,2).toUpperCase() : (p[0][0] + p[p.length-1][0]).toUpperCase();
}

let toastTimer;
function showToast(msg, type = 'info', dur = 4000) {
  const t = $('toast');
  const icons = { success:'fa-circle-check', error:'fa-circle-exclamation', warning:'fa-triangle-exclamation', info:'fa-circle-info' };
  t.innerHTML = `<i class="fas ${icons[type]}"></i> ${msg}`;
  t.className = 'toast ' + type + ' show';
  clearTimeout(toastTimer);
  if (dur > 0) toastTimer = setTimeout(() => t.classList.remove('show'), dur);
}

function setConn(status, msg) {
  const dot = $('connDot'), txt = $('connText');
  dot.className = 'dot ' + status;
  txt.textContent = msg;
}

/* ===== API ===== */
async function apiGet(action, params = {}) {
  const qs = new URLSearchParams({ action, t: Date.now(), ...params });
  const r = await fetch(CONFIG.API_URL + '?' + qs.toString(), { redirect: 'follow' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function apiPost(action, data = {}) {
  const r = await fetch(CONFIG.API_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...data })
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ===== LOAD DATA ===== */
async function checkConn() {
  setConn('checking', 'Mengecek...');
  try {
    const j = await apiGet('ping');
    if (j.success) { setConn('online', 'Terhubung'); return true; }
    throw new Error('fail');
  } catch { setConn('offline', 'Offline'); return false; }
}

async function loadData() {
  State.tanggal = todayStr();
  
  // Coba dari cache dulu
  try {
    const c = localStorage.getItem('presensi_mhs_cache');
    if (c) State.mahasiswa = JSON.parse(c);
    const p = localStorage.getItem('presensi_hari_cache');
    if (p) {
      const parsed = JSON.parse(p);
      if (parsed.tanggal === State.tanggal) State.presensi = parsed.map || {};
    }
    renderRoster();
    renderStats();
  } catch {}
  
  // Cek koneksi
  const online = await checkConn();
  if (!online) {
    if (!State.mahasiswa.length) {
      $('rosterList').innerHTML = `
        <div class="loading">
          <i class="fas fa-wifi" style="color:var(--hot);"></i>
          Tidak ada koneksi<br><br>
          <button onclick="loadData()" style="padding:8px 16px;background:var(--neon);color:var(--bg);border:none;border-radius:10px;font-weight:700;cursor:pointer;">
            Coba Lagi
          </button>
        </div>`;
    }
    return;
  }
  
  try {
    const m = await apiGet('get_all');
    if (m.success && Array.isArray(m.data)) {
      State.mahasiswa = m.data;
      localStorage.setItem('presensi_mhs_cache', JSON.stringify(m.data));
    }
    
    const p = await apiGet('get_presensi', { tanggal: State.tanggal });
    if (p.success && Array.isArray(p.data)) {
      const map = {};
      p.data.forEach(x => { if (x.nim) map[String(x.nim).trim()] = x; });
      State.presensi = map;
      localStorage.setItem('presensi_hari_cache', JSON.stringify({ tanggal: State.tanggal, map }));
    }
    
    renderRoster();
    renderStats();
    showToast(`${State.mahasiswa.length} mahasiswa · ${Object.keys(State.presensi).length} hadir`, 'success', 2500);
  } catch (err) {
    console.error(err);
    showToast('Gagal memuat: ' + err.message, 'error', 4000);
  }
}

/* ===== RENDER ===== */
function renderRoster() {
  const list = $('rosterList');
  if (!State.mahasiswa.length) {
    list.innerHTML = `
      <div class="loading">
        <i class="fas fa-inbox"></i>
        Belum ada data mahasiswa
      </div>`;
    return;
  }
  
  list.innerHTML = State.mahasiswa.map(m => {
    const nim = String(m.nim || '').trim();
    const hadir = !!State.presensi[nim];
    return `
      <div class="mhs ${hadir ? 'hadir' : ''}">
        <div class="mhs-avatar">${escapeHtml(initials(m.nama))}</div>
        <div class="mhs-info">
          <div class="mhs-name">${escapeHtml(m.nama || '-')}</div>
          <div class="mhs-meta">
            <span class="nim">${escapeHtml(nim)}</span> · ${escapeHtml(m.kelas || '-')}
          </div>
        </div>
        <span class="mhs-status ${hadir ? 'hadir' : 'belum'}">${hadir ? 'HADIR' : 'BELUM'}</span>
      </div>`;
  }).join('');
}

function renderStats() {
  const total = State.mahasiswa.length;
  const hadir = Object.keys(State.presensi).length;
  $('statHadir').textContent = hadir;
  $('statBelum').textContent = Math.max(0, total - hadir);
  $('totalText').textContent = `${hadir}/${total}`;
}

/* ===== SCANNER ===== */
function toggleScan() {
  if (State.scanning) stopScan();
  else startScan();
}

function startScan() {
  if (State.scanning) return;
  if (State.scanner) { try { State.scanner.clear(); } catch {} State.scanner = null; }
  
  $('reader').innerHTML = '';
  $('btnScan').classList.add('stop');
  $('btnScanText').textContent = 'Stop Scan';
  
  try {
    State.scanner = new Html5Qrcode("reader", {
      verbose: false,
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
    });
    
    const cfg = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 4/3 };
    const onOk = t => onScan(t);
    const onErr = () => {};
    
    State.scanner.start({ facingMode: "environment" }, cfg, onOk, onErr)
      .then(() => onStart())
      .catch(() => {
        State.scanner.start({ facingMode: "user" }, cfg, onOk, onErr)
          .then(() => onStart())
          .catch(e => {
            showToast('Gagal kamera: ' + e.message, 'error', 0);
            resetBtn();
          });
      });
  } catch (e) {
    showToast('Error init scanner', 'error', 0);
    resetBtn();
  }
}

function onStart() {
  State.scanning = true;
  $('scanText').textContent = '🔍 Arahkan ke QR Code...';
  showToast('Kamera aktif', 'info', 2000);
}

function stopScan() {
  if (State.scanner && State.scanning) {
    State.scanner.stop().then(() => {
      try { State.scanner.clear(); } catch {}
      State.scanner = null;
      State.scanning = false;
      resetBtn();
      $('scanText').textContent = '⏸ Scanner berhenti';
    }).catch(() => {});
  } else {
    State.scanning = false;
    resetBtn();
  }
}

function resetBtn() {
  $('btnScan').classList.remove('stop');
  $('btnScanText').textContent = 'Mulai Scan';
}

/* ===== SCAN ===== */
function onScan(text) {
  if (State.processing) return;
  State.processing = true;
  
  if (State.scanner && State.scanning) {
    State.scanner.stop().then(() => {
      try { State.scanner.clear(); } catch {}
      State.scanner = null;
      State.scanning = false;
      resetBtn();
    }).catch(() => {});
  }
  
  processPresensi(text);
}

async function processPresensi(qr) {
  try {
    showToast('Memproses...', 'info', 0);
    
    let nim = '';
    try {
      const p = JSON.parse(qr);
      nim = String(p.nim || '').trim();
    } catch {
      nim = String(qr || '').trim();
    }
    
    if (!nim || nim.length < 3) {
      showToast('NIM tidak valid', 'error');
      return;
    }
    
    const m = State.mahasiswa.find(x => String(x.nim).trim() === nim);
    if (!m) {
      showToast(`NIM ${nim} tidak terdaftar`, 'error');
      return;
    }
    
    if (State.presensi[nim]) {
      showToast(`${m.nama} sudah presensi`, 'warning');
      $('scanText').textContent = '⚠️ Sudah presensi';
      return;
    }
    
    const payload = {
      nim, nama: m.nama || '', kelas: m.kelas || '',
      jurusan: m.jurusan || '', mataKuliah: 'Presensi Kelas', status: 'Hadir'
    };
    
    let res;
    try {
      res = await apiPost('presensi', payload);
    } catch (e) {
      // Offline: simpan lokal
      State.presensi[nim] = { nim, waktu: new Date().toLocaleString('id-ID'), offline: true };
      localStorage.setItem('presensi_hari_cache', JSON.stringify({ tanggal: State.tanggal, map: State.presensi }));
      renderRoster();
      renderStats();
      showToast(`Offline — ${m.nama} dicatat lokal`, 'warning', 5000);
      return;
    }
    
    if (res.success) {
      State.presensi[nim] = { nim, waktu: res.waktu || '' };
      localStorage.setItem('presensi_hari_cache', JSON.stringify({ tanggal: State.tanggal, map: State.presensi }));
      renderRoster();
      renderStats();
      showToast(`✅ ${m.nama} HADIR!`, 'success', 3500);
      $('scanText').textContent = '✅ Hadir!';
    } else if (res.already) {
      State.presensi[nim] = { nim, waktu: res.data?.waktu || '' };
      localStorage.setItem('presensi_hari_cache', JSON.stringify({ tanggal: State.tanggal, map: State.presensi }));
      renderRoster();
      renderStats();
      showToast(`${m.nama} sudah presensi`, 'warning', 3500);
      $('scanText').textContent = '⚠️ Sudah presensi';
    } else {
      showToast(res.error || 'Gagal menyimpan', 'error', 4000);
    }
  } catch (err) {
    console.error(err);
    showToast('Error: ' + err.message, 'error', 4000);
  } finally {
    setTimeout(() => {
      State.processing = false;
      $('scanText').textContent = 'Arahkan ke QR Code';
      if (!State.scanning) startScan();
    }, CONFIG.RESCAN_DELAY);
  }
}

/* ===== FLASH ===== */
async function toggleFlash() {
  State.flashOn = !State.flashOn;
  $('btnFlash').classList.toggle('active', State.flashOn);
  try {
    const v = document.querySelector('#reader video');
    if (!v || !v.srcObject) return;
    const t = v.srcObject.getVideoTracks()[0];
    if (!t) return;
    const c = t.getCapabilities ? t.getCapabilities() : {};
    if (c.torch) await t.applyConstraints({ advanced: [{ torch: State.flashOn }] });
  } catch {}
}

/* ===== INIT ===== */
async function init() {
  await loadData();
  setInterval(loadData, CONFIG.REFRESH_INTERVAL);
  
  // Auto-start scanner
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    s.getTracks().forEach(t => t.stop());
    setTimeout(startScan, 800);
  } catch (e) {
    showToast('Izinkan kamera untuk scan', 'warning', 5000);
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
